<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Promo Calendar Sync</title>
  <style>
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #16191F; margin: 0; padding: 16px; width: 340px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { color: #667085; margin: 0 0 14px; font-size: 13px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #667085; margin-bottom: 12px; }
    input[type=text] { display: block; width: 100%; box-sizing: border-box; height: 34px; margin-top: 5px; padding: 0 9px; border: 1px solid #E3E6EB; border-radius: 6px; font: inherit; color: #16191F; }
    .check { display: flex; gap: 8px; align-items: center; color: #16191F; font-weight: 500; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    button { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid #E3E6EB; background: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button.primary { background: #1A56DB; border-color: #1A56DB; color: #fff; }
    #status { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
    .ok { color: #166534; } .err { color: #B42318; }
  </style>
</head>
<body>
  <h1>Promo Calendar Sync</h1>
  <p>Open any marketplace's Mirakl <b>Price and stock → Promotions</b> page and its campaigns are sent to the calendar automatically.</p>
  <label>Calendar address<input type="text" id="appUrl" placeholder="http://localhost:4300"></label>
  <label>Your import key<input type="text" id="key" placeholder="pck_…  (from the app: ⋯ → Chrome extension)"></label>
  <label class="check"><input type="checkbox" id="auto"> Send automatically when the page opens</label>
  <div class="row"><button class="primary" id="save">Save</button><button id="test">Test connection</button></div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
